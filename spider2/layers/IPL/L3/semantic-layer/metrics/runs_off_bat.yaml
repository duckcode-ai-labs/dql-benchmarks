name: runs_off_bat
label: Runs off the bat
description: >-
  Sum of batsman_scored.runs_scored: runs the striker hit off the bat (0-6 per delivery). Excludes all extras
  (wides, no-balls, byes, leg-byes, penalty), which are in extra_runs. A batter's runs = this metric grouped by
  ball_by_ball.striker on the same delivery (match_id, innings_no, over_id, ball_id).
domain: ipl
status: certified
owner: benchmark-owner
type: sum
sql: runs_scored
table: batsman_scored
tags: [ipl, batting, runs]
