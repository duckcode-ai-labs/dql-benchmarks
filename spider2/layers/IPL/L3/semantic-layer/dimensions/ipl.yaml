dimensions:
  - name: extra_type
    label: Extra type
    description: 'Kind of extra on the delivery: wides, noballs, legbyes, byes, penalty.'
    domain: ipl
    type: string
    sql: extra_type
    table: extra_runs
    owner: benchmark-owner
  - name: kind_out
    label: Dismissal kind
    description: 'How the batter was out: caught, bowled, run out, lbw, stumped, caught and bowled, retired hurt, hit wicket, obstructing the field.'
    domain: ipl
    type: string
    sql: kind_out
    table: wicket_taken
    owner: benchmark-owner
  - name: season_id
    label: Season id
    description: 'IPL season 1-9; season year = season_id + 2007 (2008-2016).'
    domain: ipl
    type: number
    sql: season_id
    table: match
    owner: benchmark-owner
  - name: venue
    label: Venue
    description: Ground where the match was played (free text; 35 names).
    domain: ipl
    type: string
    sql: venue
    table: match
    owner: benchmark-owner
  - name: match_date
    label: Match date
    description: Match date, TEXT YYYY-MM-DD.
    domain: ipl
    type: date
    sql: match_date
    table: match
    isTimeDimension: true
    owner: benchmark-owner
