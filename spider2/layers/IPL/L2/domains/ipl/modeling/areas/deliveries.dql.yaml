# Ball-by-ball facts: each delivery bowled and the runs, extras and dismissals recorded on it.
domain: ipl
area:
  id: deliveries
  name: 'Deliveries: runs, extras and wickets'
  description: >-
    ball_by_ball is the record of each delivery (who batted, who bowled); batsman_scored, extra_runs and wicket_taken hang off it one-to-one
    on match_id + innings_no + over_id + ball_id and hold the runs off the bat, the extras and the dismissals. Innings runs = runs off the
    bat + extras, summed from batsman_scored and extra_runs directly (not through ball_by_ball, which misses one delivery).
  references:
    - match
    - player
    - player_match
    - team
entities:
  - id: ball_by_ball
    relation: main.ball_by_ball
    business_name: Delivery
    analytical_role: event
    grain: match_id, innings_no, over_id, ball_id
    keys:
      - match_id
      - innings_no
      - over_id
      - ball_id
    business_context: >-
      One delivery bowled (134,703 rows over 568 matches; unique on match_id + innings_no + over_id + ball_id). innings_no is 1 or 2 only
      (no super overs). over_id is 1-20 (the first over is 1). ball_id is the delivery sequence within the over, 1-9: wides and no-balls are
      re-bowled, so an over with extras has more than 6 deliveries. team_batting and team_bowling are team ids; striker (batter on strike),
      non_striker and bowler are player ids; striker_batting_position is 1-11. All columns are filled. This table holds who faced and who
      bowled but no runs: runs off the bat are in batsman_scored, extras in extra_runs, dismissals in wicket_taken. Known defects: in
      matches 392202, 392207 and 419119, 169 second-innings rows have team_batting and team_bowling swapped (player_match gives the right
      team); the first delivery of match 335987 (a leg-bye) is missing here but present in extra_runs. An innings can end before over 20
      (all out, target reached, or a rain-shortened match).
    status: certified
    owner: benchmark-owner
  - id: batsman_scored
    relation: main.batsman_scored
    business_name: Runs off the bat
    analytical_role: event
    grain: match_id, innings_no, over_id, ball_id
    keys:
      - match_id
      - innings_no
      - over_id
      - ball_id
    business_context: >-
      Runs the striker scored off the bat on one delivery (131,259 rows; runs_scored 0-6: 0 = dot ball, 4 and 6 are boundaries). Every row
      matches a delivery in ball_by_ball. Every delivery has a row except most wides. Extras are not included here: byes, leg-byes, wides,
      no-ball and penalty runs are in extra_runs. The batter credited is ball_by_ball.striker on the same delivery.
    status: certified
    owner: benchmark-owner
  - id: extra_run
    relation: main.extra_runs
    business_name: Extras
    analytical_role: event
    grain: match_id, innings_no, over_id, ball_id
    keys:
      - match_id
      - innings_no
      - over_id
      - ball_id
    business_context: >-
      Extras conceded on one delivery (7,349 rows; one row per delivery that had extras). extra_type is "wides", "legbyes", "noballs",
      "byes" or "penalty". extra_runs (1-5) is the total extras on that delivery, e.g. a wide that ran to the boundary is 5. Runs the batter
      hit off a no-ball are in batsman_scored, not here. One row (match 335987, innings 1, over 1, ball 1) has no delivery row in
      ball_by_ball.
    status: certified
    owner: benchmark-owner
  - id: wicket_taken
    relation: main.wicket_taken
    business_name: Dismissal
    analytical_role: event
    grain: match_id, innings_no, over_id, ball_id
    keys:
      - match_id
      - innings_no
      - over_id
      - ball_id
    business_context: >-
      One batter out on one delivery (6,618 rows; at most one per delivery). player_out is the dismissed player (usually the striker; a
      non-striker is out only by run out). kind_out: caught, bowled, run out, lbw, stumped, caught and bowled, retired hurt, hit wicket,
      obstructing the field. There is no bowler or fielder column: the bowler is ball_by_ball.bowler on the same delivery. Every row matches
      a delivery in ball_by_ball.
    status: certified
    owner: benchmark-owner
