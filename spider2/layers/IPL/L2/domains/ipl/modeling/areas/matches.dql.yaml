# Matches, teams, players and the playing XI of each match.
domain: ipl
area:
  id: matches
  name: Matches, teams and players
  description: >-
    match holds one row per match with season, date, venue, toss and result; team and player are the dimensions; player_match is the playing
    XI of each match with the team each player represented and his role.
  references:
    - ball_by_ball
entities:
  - id: match
    relation: main.match
    business_name: Match
    analytical_role: event
    grain: match_id
    keys:
      - match_id
    business_context: >-
      One IPL match (567 rows; match_id unique). Seasons 2008-2016: season_id 1-9 where the season year = season_id + 2007 (checked on every
      row against the year of match_date); there is no season table. match_date is TEXT in YYYY-MM-DD form. team_1 and team_2 are the two
      team ids (listing order only; the data does not say which is home). venue is free text (35 names; the Mohali ground appears under two
      names). toss_winner is a team id and toss_decision is the toss winner's choice, "bat" or "field" (checked: the toss winner bats first
      exactly when the decision is "bat"). win_type is "runs" (the side batting first won by win_margin runs) or "wickets" (the chasing side
      won with win_margin wickets in hand). outcome_type is always "Result"; match_winner (team id, always one of the two teams) and
      man_of_the_match (player id) are always filled. Innings totals (runs off the bat + extras) reproduce the result exactly in 545 of 567
      matches; the others are rain-shortened matches with revised targets or have small gaps in the ball data. There are no ties, no-results
      or super overs in this table. Match 419136 (id between two 2010 matches) has deliveries and a playing XI in the other tables but no
      row here.
    status: certified
    owner: benchmark-owner
  - id: team
    relation: main.team
    business_name: Team
    analytical_role: dimension
    grain: team_id
    keys:
      - team_id
    business_context: >-
      One IPL franchise: team_id and its name (12 rows, team_id 2-13). team_id 1 is used in match, player_match and ball_by_ball (129
      matches, 51 of them at Eden Gardens) but has no row here, so its name is not in the data: join teams with LEFT JOIN and show the id
      when the name is missing. Franchises that were renamed or replaced keep separate ids (for example Deccan Chargers 8 and Sunrisers
      Hyderabad 11; Pune Warriors 10 and Rising Pune Supergiants 12).
    status: certified
    owner: benchmark-owner
  - id: player
    relation: main.player
    business_name: Player
    analytical_role: dimension
    grain: player_id
    keys:
      - player_id
    business_context: >-
      One player (468 rows, player_id 1-469; player_name is unique and in scorecard short form such as "V Kohli"). dob is TEXT YYYY-MM-DD,
      always filled. batting_hand is "Right-hand bat" or "Left-hand bat". bowling_skill is a style label (14 values, e.g. "Right-arm
      medium", "Right-arm offbreak", "Legbreak googly", "Slow left-arm orthodox"). country_name has 11 values (India 261; one value is
      spelled "Zimbabwea"). player_id 35 has no row here although it appears in player_match (124 matches), ball_by_ball and wicket_taken
      and has 7 man-of-the-match awards: join players with LEFT JOIN so that player is not dropped.
    status: certified
    owner: benchmark-owner
  - id: player_match
    relation: main.player_match
    business_name: Player in a match (playing XI)
    analytical_role: bridge
    grain: match_id, player_id
    keys:
      - match_id
      - player_id
    business_context: >-
      One player selected in one match, with the team he played for (team_id) and his role (12,495 rows; unique on match_id + player_id).
      role is "Player", "Captain", "Keeper" or "CaptainKeeper" (captain who also kept wicket); each team in a match has exactly one keeper.
      Each of the 568 matches has two teams of 11, except match 501274 where team 1 lists 10 (player 40 batted but is not listed). This is
      the table that says which team a player represented in a given match; a player can play for different teams in different seasons.
      Covers match 419136, which is missing from match.
    status: certified
    owner: benchmark-owner
relationships:
  - id: player_match_to_match
    from: player_match
    to: match
    verb: plays in
    description: >-
      A playing-XI row belongs to one match. Checked on the warehouse 2026-09-23: 12495 player_match rows, 12473 join, 22 unmatched (0.18%),
      0 null keys, at most 1 match row per key. The unmatched rows are all match 419136, which is not in match; join LEFT so they are kept.
    keys:
      - from: match_id
        to: match_id
    cardinality: many_to_one
    fanout: safe
    join_types:
      - left
    status: certified
    owner: benchmark-owner
    certifiedAgainst:
      from:
        grain: match_id, player_id
        keys:
          - match_id
          - player_id
      to:
        grain: match_id
