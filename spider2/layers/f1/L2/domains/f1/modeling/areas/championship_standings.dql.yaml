# Drivers' and constructors' championship tables, recorded after every race.
domain: f1
area:
  id: championship_standings
  name: Championship standings
  description: >-
    Standings are cumulative championship tables snapshotted after each race of a season:
    points, position and wins so far that season. The final standing of a season is the
    snapshot at the season's last race with standings. driver_standings_ext completes the
    drivers' table with the drivers who raced but were missing from the source standings.
  references: [race, driver, constructor]
  intent_examples:
    - world champion of a season
    - championship position after a race
    - constructors' champion
    - points gap in the championship
entities:
  - id: driver_standing
    relation: main.driver_standings
    business_name: Driver championship standing
    business_context: >-
      A driver's drivers'-championship standing after one race (34,595 rows, 1950 to
      2024-07-07). points = cumulative championship points so far that season (race points plus
      sprint points); wins = cumulative race wins so far that season; position = championship
      position (position_text is the same as text; 'D' once = disqualified from the
      1997 championship). race_id + driver_id is unique. Up to 1990 the points are the championship
      points after dropped scores (best-N results rules), so for some drivers they are lower than
      the sum of their race points. Not every driver who started a race has a row (see
      driver_standings_ext).
    analytical_role: snapshot
    grain: driver_standings_id
    keys: [driver_standings_id]
    owner: benchmark-owner
  - id: driver_standings_ext
    relation: main.driver_standings_ext
    business_name: Driver championship standing (completed)
    business_context: >-
      Derived copy of driver_standings (all 34,595 rows unchanged) plus 417 added rows for drivers
      who have a result in that race but no standings row in the source. Added rows have
      driver_standings_id = 0, points 0, wins 0, position_text NULL and a position placed after
      the recorded drivers. race_id + driver_id is unique (driver_standings_id is not: 0 repeats).
    analytical_role: snapshot
    grain: race_id, driver_id
    keys: [race_id, driver_id]
    owner: benchmark-owner
  - id: constructor_standing
    relation: main.constructor_standings
    business_name: Constructor championship standing
    business_context: >-
      A constructor's constructors'-championship standing after one race (13,271 rows, 1958 to
      2024-07-07). points = cumulative constructor points so far that season; wins = cumulative
      race wins; position = championship position; position_text 'E' = excluded (McLaren 2007,
      whose position is stored as 11, last). race_id + constructor_id is unique.
    analytical_role: snapshot
    grain: constructor_standings_id
    keys: [constructor_standings_id]
    owner: benchmark-owner
relationships:
  - id: driver_standing_to_race
    from: driver_standing
    to: race
    verb: is the table after
    keys: [{ from: race_id, to: race_id }]
    cardinality: many_to_one
    fanout: safe
    owner: benchmark-owner
    status: certified
    description: "Certified on the warehouse: 34,595 from rows, 1,125 to rows, 34,595 joined rows, 0 unmatched from rows, 0 null keys; at most 1 to row per key (at most 108 from rows per key), so the declared cardinality holds."
    certifiedAgainst:
      from: { grain: "driver_standings_id", keys: [driver_standings_id] }
      to: { grain: "race_id", keys: [race_id] }
    validation:
      status: passed
      checked_at: '2026-09-23T15:58:25.838Z'
