# What happened in each race: classification, sprint races, qualifying, retirements and per-constructor race points.
domain: f1
area:
  id: race_results
  name: Race results and qualifying
  description: >-
    results is the record of each car's race outcome (finishing position, points, laps, status).
    sprint_results is the same for sprint races (2021 onward). qualifying holds qualifying
    positions and Q1/Q2/Q3 times (1994 onward). retirements lists every non-finishing result with
    the lap it ended on and a retirement type. constructor_results holds a constructor's points
    for one race.
  references: [race, driver, constructor, status]
  intent_examples:
    - race winners
    - points scored by a driver in a season
    - podium finishes
    - pole positions
    - retirements by cause
    - fastest laps
entities:
  - id: result
    relation: main.results
    business_name: Race result
    business_context: >-
      One car's result in one race (26,519 rows, 1,113 races 1950 to 2024-07-07). grid = starting
      position (0 = no grid slot: pit-lane start or did not start/qualify). position = finishing
      position, NULL when not classified; position_text = the position as text or a code: R
      retired, D disqualified, E excluded, W withdrew, F failed to qualify, N not classified.
      position_order = the full order of all cars (always filled; use it to rank everyone).
      points = points for this race (REAL, half points exist, e.g. 4.5; includes the fastest-lap
      point where awarded, excludes sprint points). laps = laps completed. time = winner's total
      time (h:mm:ss.sss) or gap text (+11.987) for others, milliseconds = total race time; both
      filled only for 7,533 classified finishers on a timed lap. fastest_lap (lap number),
      fastest_lap_time (m:ss.sss text), fastest_lap_speed (km/h as text) and rank (rank of the
      car's fastest lap in the race, 1 = fastest lap of the race; 0 = no timed lap) are filled only from 2004.
      status_id -> status. In 1950-1978 a driver can have two rows in one race (shared or
      changed cars), so race_id + driver_id is not unique; race_id + driver_id + position_order is.
    analytical_role: event
    grain: result_id
    keys: [result_id]
    owner: benchmark-owner
  - id: sprint_result
    relation: main.sprint_results
    business_name: Sprint race result
    business_context: >-
      One car's result in a sprint race (300 rows, 15 sprint weekends 2021 to 2024-06-30); same
      columns and codes as results (no rank column; fastest_lap_speed empty). points are sprint
      points (e.g. 3/2/1 in 2021, 8 for the winner from 2022). result_id is its own sequence
      (1-300) and is NOT a results.result_id; the matching race result is found on race_id +
      driver_id. race_id is the Grand Prix weekend the sprint belongs to.
    analytical_role: event
    grain: result_id
    keys: [result_id]
    owner: benchmark-owner
  - id: qualifying
    relation: main.qualifying
    business_name: Qualifying result
    business_context: >-
      One driver's qualifying result for one race (10,254 rows, 1994 to 2024-07-07; only some races
      in 1996-2002). position = qualifying position (always filled). q1, q2, q3 = best lap time in
      each session as text m:ss.sss; q2 is filled from 2005 and q3 from 2006 for drivers who
      reached those sessions, else NULL or empty string. race_id + driver_id is unique. The
      starting grid can differ from the qualifying position (penalties); results.grid is the grid.
    analytical_role: event
    grain: qualify_id
    keys: [qualify_id]
    owner: benchmark-owner
  - id: retirement
    relation: main.retirements
    business_name: Retirement
    business_context: >-
      Derived: one row per non-finishing race result (11,568 rows), i.e. every results row whose
      status is not "Finished" and not "+N Laps". lap = the lap on which the car stopped
      (results.laps + 1). position_order and status_id are copied from results. retirement_type
      classifies the status: "Retirement (Driver Error)" = Accident, Collision or Spun off;
      "Retirement (Disqualification)" = Disqualified; "Retirement (Mechanical Problem)" = every
      other status, which also includes Did not qualify, Withdrew and Not classified.
      race_id + driver_id + position_order is unique.
    analytical_role: event
    grain: race_id, driver_id, position_order
    keys: [race_id, driver_id, position_order]
    owner: benchmark-owner
  - id: constructor_result
    relation: main.constructor_results
    business_name: Constructor race result
    business_context: >-
      One constructor's points from one race (12,505 rows, 1958 onward, when the constructors'
      championship began). race_id + constructor_id is unique. points = constructor points that
      race: the sum of its cars' results points from 1980 on, plus sprint points from 2021; before
      1980 only the best-placed car usually scored. status is empty except 'D' (disqualified,
      McLaren 2007).
    analytical_role: event
    grain: constructor_results_id
    keys: [constructor_results_id]
    owner: benchmark-owner
