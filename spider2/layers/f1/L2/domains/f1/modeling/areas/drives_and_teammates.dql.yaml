# Which driver drove for which constructor in a season, and how teammates rank within a team.
domain: f1
area:
  id: drives_and_teammates
  name: Drives and teammates
  description: >-
    drives lists each driver's stints with a constructor within a season, by round. team_driver_ranks
    orders the drivers of a constructor in a season (1 = lead driver); tdr_overrides holds the
    manual corrections to that order.
  references: [season, driver, constructor]
  intent_examples:
    - drivers who drove for a team in a season
    - drivers who changed team mid-season
    - teammates
    - lead driver of a team
entities:
  - id: drive
    relation: main.drives
    business_name: Drive (stint)
    business_context: >-
      Derived: one continuous stint of a driver in a season (3,784 rows). A stint with a
      constructor (drive_id 1, 2, ... in order within the season) covers rounds first_round to
      last_round. Rows with drive_id = -1 and constructor_id = -1 (163) are gaps: rounds between
      two stints in which the driver had no result. is_first_drive_of_season /
      is_final_drive_of_season are 1/0 flags (both 0 on gap rows). A driver entered in two cars in
      the same round (1950s) has two stints with the same drive_id, so the grain is year +
      driver_id + constructor_id + first_round.
    analytical_role: event
    grain: year, driver_id, constructor_id, first_round
    keys: [year, driver_id, constructor_id, first_round]
    owner: benchmark-owner
  - id: team_driver_rank
    relation: main.team_driver_ranks
    business_name: Team driver rank
    business_context: >-
      One driver of one constructor in one season (3,530 rows) with team_driver_rank = the
      driver's rank within that team that season (1 = lead driver; up to 29 for teams with many
      entrants in the 1950s). Carries both ids and refs (constructor_ref, driver_ref). year +
      constructor_id + driver_id is unique and so is year + constructor_id + team_driver_rank.
      The rank is supplied with the data: it is not reproducible from points or races alone
      (points order matches 2,062 of 3,530 rows) and includes the tdr_overrides corrections.
    analytical_role: dimension
    grain: year, constructor_id, driver_id
    keys: [year, constructor_id, driver_id]
    owner: benchmark-owner
  - id: tdr_override
    relation: main.tdr_overrides
    business_name: Team driver rank override
    business_context: >-
      Manual corrections of team_driver_rank (48 rows, 2004 to 2022) keyed by year,
      constructor_ref and driver_ref. All 48 are already applied in team_driver_ranks.
    analytical_role: dimension
    grain: year, constructor_ref, driver_ref
    keys: [year, constructor_ref, driver_ref]
    owner: benchmark-owner
relationships:
  - id: drive_to_season
    from: drive
    to: season
    verb: is in
    keys: [{ from: year, to: year }]
    cardinality: many_to_one
    fanout: safe
