# Seasons, races and circuits, and the drivers, constructors and status codes every fact table points to.
domain: f1
area:
  id: calendar_and_participants
  name: Calendar and participants
  description: >-
    The Formula 1 world championship from 1950 to 2024. A season (year) has races (Grands Prix),
    each held at a circuit and numbered by round within the season. Drivers and constructors
    (teams) take part in races. Status holds the finishing-status codes used by results.
    The *_ext tables are derived copies of circuits, races, drivers and constructors with extra
    precomputed columns; short-name lookups give display names.
  intent_examples:
    - races held at a circuit
    - drivers by nationality
    - races in a season
    - constructor nationality
entities:
  - id: season
    relation: main.seasons
    business_name: Season
    business_context: >-
      One championship season (year, 1950 to 2024, 75 rows) with its Wikipedia url. Every race,
      drive and team-driver rank belongs to a season through its year column. The 2024 season is
      only partly played in this data: 24 races are scheduled but results, standings and laps
      stop after round 12 (British Grand Prix, 2024-07-07).
    analytical_role: dimension
    grain: year
    keys: [year]
    owner: benchmark-owner
  - id: circuit
    relation: main.circuits
    business_name: Circuit
    business_context: >-
      One racing circuit (77 rows). circuit_ref is a unique lowercase text key (e.g. monza,
      silverstone); name is the full circuit name; location is the town and country is the country
      (e.g. UK, USA, Italy). lat/lng are decimal degrees and alt is altitude in metres; all filled.
      Every circuit has hosted at least one race.
    analytical_role: dimension
    grain: circuit_id
    keys: [circuit_id]
    owner: benchmark-owner
  - id: circuits_ext
    relation: main.circuits_ext
    business_name: Circuit (extended)
    business_context: >-
      Derived copy of circuits (same 77 rows and identical columns) plus two precomputed columns:
      last_race_year = the latest season with a race scheduled at the circuit, and number_of_races =
      the count of races rows at the circuit, including the 2024 races that are scheduled but have
      no results yet (for 12 circuits it differs from the count of races with results).
    analytical_role: dimension
    grain: circuit_id
    keys: [circuit_id]
    owner: benchmark-owner
  - id: race
    relation: main.races
    business_name: Race
    business_context: >-
      One Grand Prix (1,125 rows, 1950-05-13 to 2024-12-08). year + round is unique (round is the
      race's order within the season). name is the Grand Prix name (e.g. "British Grand Prix"),
      circuit_id the venue. date is text YYYY-MM-DD; time is text HH:MM:SS race start in UTC
      (e.g. Australian GP 2023 at 05:00:00) and is filled for 394 races, NULL for older ones.
      fp1..fp3, quali and sprint date/time columns are text and filled only from 2021 (90 races);
      sprint_date is set only for sprint weekends. The 12 races of 2024 after 2024-07-07 are
      scheduled only: they have no results, standings or laps.
    analytical_role: dimension
    grain: race_id
    keys: [race_id]
    owner: benchmark-owner
  - id: races_ext
    relation: main.races_ext
    business_name: Race (extended)
    business_context: >-
      Derived copy of races (same 1,125 rows, identical columns) plus: is_pit_data_available
      (1 for the 273 races that have pit_stops rows, 2011 onward, else 0); short_name (short
      Grand Prix name from short_grand_prix_names, e.g. "Britain", falling back to the full name
      when the lookup has none); has_sprint (1 for the 15 races with sprint_results rows,
      2021-2024); max_points (the most points one driver could score that weekend under that
      season's system: 8, 9, 10, 25, 26, 29 or 34, winner's points plus any fastest-lap point and
      sprint-winner points).
    analytical_role: dimension
    grain: race_id
    keys: [race_id]
    owner: benchmark-owner
  - id: short_grand_prix_name
    relation: main.short_grand_prix_names
    business_name: Short Grand Prix name
    business_context: >-
      Lookup from a full Grand Prix name (full_name, matches races.name) to a short display name
      (short_name, e.g. "British Grand Prix" -> "Britain", "Mexico City Grand Prix" -> "Mexico").
      40 rows; it does not cover every race name (e.g. Argentine, Swedish, Las Vegas GPs).
    analytical_role: dimension
    grain: full_name
    keys: [full_name]
    owner: benchmark-owner
  - id: driver
    relation: main.drivers
    business_name: Driver
    business_context: >-
      One Formula 1 driver (859 rows). driver_ref is a unique lowercase text key (e.g. hamilton);
      forename and surname are filled and full_name is a generated column (forename || ' ' ||
      surname). dob is the date of birth as text YYYY-MM-DD (1896 to 2005). nationality is a
      demonym (British, American, Italian...). number (permanent car number) is filled for only 57
      drivers and code (three-letter code, e.g. HAM) for 102; both are NULL for older drivers.
    analytical_role: dimension
    grain: driver_id
    keys: [driver_id]
    owner: benchmark-owner
  - id: drivers_ext
    relation: main.drivers_ext
    business_name: Driver (extended)
    business_context: >-
      Derived copy of drivers (same 859 rows). Identical to drivers except that code is filled for
      every driver: where drivers.code is NULL a code is derived, mostly the first three letters of
      the surname in upper case (738 of 757), so codes are not unique here (SCH is used by 15
      drivers). full_name is stored, dob is text YYYY-MM-DD.
    analytical_role: dimension
    grain: driver_id
    keys: [driver_id]
    owner: benchmark-owner
  - id: constructor
    relation: main.constructors
    business_name: Constructor
    business_context: >-
      One constructor (team entry) (212 rows). constructor_ref is a unique lowercase text key
      (e.g. mclaren, red_bull); name is the entrant name, which in the 1950s-70s often includes the
      engine (e.g. "Cooper-Climax", "Lotus-Ford"); nationality is a demonym.
    analytical_role: dimension
    grain: constructor_id
    keys: [constructor_id]
    owner: benchmark-owner
  - id: constructors_ext
    relation: main.constructors_ext
    business_name: Constructor (extended)
    business_context: >-
      Derived copy of constructors (same 212 rows) plus short_name: the short team name from
      short_constructor_names when listed (e.g. "Cooper-Climax" -> "Cooper", "Haas F1 Team" ->
      "Haas"), otherwise the constructor name. Filled for all 212.
    analytical_role: dimension
    grain: constructor_id
    keys: [constructor_id]
    owner: benchmark-owner
  - id: short_constructor_name
    relation: main.short_constructor_names
    business_name: Short constructor name
    business_context: >-
      Lookup from constructor_ref to a short team name that groups engine variants (44 rows;
      e.g. lotus-climax, lotus-ford, team_lotus -> Lotus). Note one value is spelled "Spkyer" for
      spyker_mf1 in the source.
    analytical_role: dimension
    grain: constructor_ref
    keys: [constructor_ref]
    owner: benchmark-owner
  - id: livery
    relation: main.liveries
    business_name: Livery colour
    business_context: >-
      A constructor's primary livery colour over a span of seasons (64 rows): constructor_ref,
      start_year, end_year (NULL = still current, 10 rows), primary_hex_code (e.g. #900000).
      constructor_ref + start_year is unique. Three rows use constructor_ref "benneton", which is
      not a constructors value (the team is "benetton").
    analytical_role: dimension
    grain: constructor_ref, start_year
    keys: [constructor_ref, start_year]
    owner: benchmark-owner
  - id: status
    relation: main.status
    business_name: Finishing status
    business_context: >-
      Lookup of finishing-status codes used by results, sprint_results and retirements (139 rows).
      status_id 1 = "Finished"; "+1 Lap", "+2 Laps"... (ids 11-19 and others) = classified
      finisher that many laps behind the winner; 2 = Disqualified, 54 = Withdrew, 62 = Not
      classified, 81 = Did not qualify, 97 = Did not prequalify, 96 = Excluded; the rest are
      retirement causes (Engine, Accident, Collision, Gearbox, Spun off, ...).
    analytical_role: dimension
    grain: status_id
    keys: [status_id]
    owner: benchmark-owner
