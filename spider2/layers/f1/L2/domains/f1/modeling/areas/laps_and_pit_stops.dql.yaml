# Lap-by-lap race data: lap times, positions per lap, pit stops and position changes (overtakes).
domain: f1
area:
  id: laps_and_pit_stops
  name: Laps, pit stops and overtakes
  description: >-
    lap_times holds every timed lap of a driver in a race (1996 onward). lap_times_ext adds the
    running race time, lap_time_stats the per-driver average and standard deviation, and
    lap_positions the running order per lap including the start (lap 0) and the lap of
    retirement (1950 onward). pit_stops records each pit stop (2011 onward). overtakes records
    each position change between two drivers from one lap to the next (2011 onward).
  references: [race, driver]
  intent_examples:
    - fastest lap time
    - average lap time of a driver
    - number of pit stops
    - pit stop duration
    - overtakes on track
    - position after lap 1
entities:
  - id: lap_time
    relation: main.lap_times
    business_name: Lap time
    business_context: >-
      One lap of one driver in one race (575,029 rows, 531 races, 1996 to 2024-06-30; the
      2024-07-07 British GP has no lap data). lap = lap number from 1. position = running position
      at the end of that lap. time = lap time as text m:ss.sss; milliseconds = the lap time in ms
      (INT, always filled, 55,404 to 7,507,547: very long laps include safety-car and red-flag
      laps); seconds = generated column milliseconds / 1000. race_id + driver_id + lap is unique.
    analytical_role: event
    grain: race_id, driver_id, lap
    keys: [race_id, driver_id, lap]
    owner: 43963011+KKranthi6881@users.noreply.github.com
  - id: lap_times_ext
    relation: main.lap_times_ext
    business_name: Lap time (with running total)
    business_context: >-
      Derived copy of lap_times (same 575,029 rows and values) plus running_milliseconds = the
      driver's cumulative race time at the end of the lap (running sum of milliseconds over laps
      1..lap, verified on every row). seconds is stored here.
    analytical_role: event
    grain: race_id, driver_id, lap
    keys: [race_id, driver_id, lap]
    owner: 43963011+KKranthi6881@users.noreply.github.com
  - id: lap_time_stat
    relation: main.lap_time_stats
    business_name: Lap time statistics
    business_context: >-
      Derived: one row per driver per race with lap times (10,789 rows). avg_milliseconds /
      avg_seconds = mean of the driver's lap_times.milliseconds in that race (all laps, including
      pit and safety-car laps); stdev_milliseconds / stdev_seconds = population standard
      deviation of those laps. race_id + driver_id is unique.
    analytical_role: event
    grain: race_id, driver_id
    keys: [race_id, driver_id]
    owner: 43963011+KKranthi6881@users.noreply.github.com
  - id: lap_position
    relation: main.lap_positions
    business_name: Position per lap
    business_context: >-
      Derived running order (613,112 rows, 1950 onward). lap_type says what a row is:
      lap 0 rows are the starting position (results.grid) typed by how it compares with
      qualifying: "Starting Position - Qualifying" (grid = qualifying position), "- Grid Drop"
      (started behind the qualifying position), "- Grid Increase" (started ahead), "- Pit Lane
      Start", "- No Qualification" (no qualifying data, mostly before 1994). "Race" rows (lap >= 1,
      1996 onward) copy lap_times.position. "Retirement (Driver Error | Mechanical Problem |
      Disqualification)" rows are on the lap the car retired, with position = its final
      position_order. A driver with two cars in one race (1950-1978) can have two rows for one lap,
      so the grain includes lap_type and position.
    analytical_role: event
    grain: race_id, driver_id, lap, lap_type, position
    keys: [race_id, driver_id, lap, lap_type, position]
    owner: 43963011+KKranthi6881@users.noreply.github.com
  - id: pit_stop
    relation: main.pit_stops
    business_name: Pit stop
    business_context: >-
      One pit stop (10,990 rows, 273 races, 2011 to 2024-07-07). stop = the driver's stop number
      in the race (1, 2, ...), lap = lap of the stop, time = local time of day of the stop
      (HH:MM:SS text). duration = time in the pit lane as text (seconds like 24.682, or m:ss.sss
      for 500 long stops); milliseconds = the same in ms; seconds = generated milliseconds / 1000.
      Stops of a minute or more are mostly red-flag stoppages recorded as pit stops (e.g. 49 in
      the 2023 Australian GP). In the 2024 Monaco GP stop numbers are not consecutive.
      race_id + driver_id + stop is unique.
    analytical_role: event
    grain: race_id, driver_id, stop
    keys: [race_id, driver_id, stop]
    owner: 43963011+KKranthi6881@users.noreply.github.com
  - id: overtake
    relation: main.overtakes
    business_name: Overtake (position change)
    business_context: >-
      Derived: one row per pair of drivers who swapped order between the previous lap and this lap
      (59,306 rows, 272 races 2011 to 2024-06-30). overtaking_driver_id moved ahead of
      overtaken_driver_id on lap; current_position / previous_position are the overtaking driver's
      positions after / before the lap. overtake_type + overtake_desc say why: S "Start" (lap 1
      versus the grid), T "Track" (an on-track pass), P "Pit Stop (Pit Entry)" (the overtaken
      driver pitted on that lap) or "Pit Stop (Pit Exit)" (pitted on the previous lap), R
      "Retirement (...)" (the overtaken driver retired). A pair can appear twice on one lap with
      different types. Grain: race, both drivers, lap and overtake_desc.
    analytical_role: event
    grain: race_id, overtaking_driver_id, overtaken_driver_id, lap, overtake_desc
    keys: [race_id, overtaking_driver_id, overtaken_driver_id, lap, overtake_desc]
    owner: 43963011+KKranthi6881@users.noreply.github.com
