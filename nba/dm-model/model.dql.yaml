entities:
  - id: player_game
    dbt_model: model.nba_analysis.local_player_game_facts
    business_name: Player game line
    business_context: 'A player''s box-score line in one game: one row per game_id, team_id, player_id, seasons 2003-2022, all game types, deduplicated. Keeps DNP rows: filter participated = true for games played and stats. 668,339 rows (one per key in the source); 558,670 have participated = true and 109,669 are DNP/DND/NWT rows (comment_text set, every stat NULL). Duplicate source records were resolved to one canonical row (lexicographically smallest serialized source row). season is the start year (2017 = 2017-18). Game type is the first digit of game_id: 1 preseason, 2 regular season, 4 playoffs, 5 play-in. Columns: points, rebounds, assists, steals, blocks, turnovers, field_goals_made/attempted, three_pointers_*, free_throws_*, plus_minus, minutes_text, is_home, opponent_team_id, game_date. The player''s team in the game is team_id; player_name is the spelling on that row (8 players have more than one spelling).'
    grain: one row per player per team per game (game_id, team_id, player_id)
    keys:
      - game_id
      - team_id
      - player_id
    analytical_role: event
    concept_refs:
      - player
    owner: Kranthi
    status: certified
  - id: team_game
    dbt_model: model.nba_analysis.local_team_game_facts
    business_name: Team game line
    business_context: 'A team''s result in one game: one row per game_id and team_id (two rows per game), seasons 2003-2022, all game types, deduplicated. is_home = true gives exactly one row per game. 26,622 games, 53,244 rows. team_points, opponent_points, team_won, team_lost (from home_team_wins), is_home, opponent_team_id, game_date, season (start year). Game type is the first digit of game_id: 1 preseason, 2 regular season, 4 playoffs, 5 play-in. 99 preseason games of season 2003 have no score (team_points NULL) and are recorded as home losses.'
    grain: one row per team per game (game_id, team_id)
    keys:
      - game_id
      - team_id
    analytical_role: event
    owner: Kranthi
    status: certified
  - id: player_season
    dbt_model: model.nba_analysis.local_player_season_facts
    business_name: Player season
    business_context: 'A player''s totals for one season: one row per player_id and season (2003-2022, all game types combined). Counts only games the player played (participated). Use for season leaders, per-game averages and shooting percentages. games_played = distinct participated games; teams_played = distinct teams; total_* sums; points/assists/rebounds_per_game = total / games_played; field_goal_pct, three_point_pct, free_throw_pct = total made / total attempted (not an average of game percentages); double_double_games = participated games with at least two of points, rebounds, assists, steals, blocks >= 10; ten_point_games etc. count single categories. 11,356 rows; 265 have games_played = 0 (only DNP rows). For multi-season or career figures, sum the totals across rows and recompute ratios from the sums. Includes preseason and playoff games; filter player_game on game_id for one game type.'
    grain: one row per player per season (player_id, season)
    keys:
      - player_id
      - season
    analytical_role: snapshot
    concept_refs:
      - player
    owner: Kranthi
    status: certified
  - id: team_season
    dbt_model: model.nba_analysis.local_team_season_facts
    business_name: Team season
    business_context: 'A team''s record for one season: one row per team_id and season (2003-2022), built only from team_game, all game types combined (preseason, regular season, play-in, playoffs). wins, losses, win_pct = wins / games_played, home_games, away_games, home_wins, away_wins, total_points, opponent_points, point_differential, first/last game date. 599 rows (29 teams in 2003, 30 after). For a regular-season-only record, aggregate team_game rows whose game_id starts with 2.'
    grain: one row per team per season (team_id, season)
    keys:
      - team_id
      - season
    analytical_role: snapshot
    owner: Kranthi
    status: certified
  - id: team
    dbt_model: model.nba_analysis.dim_teams_cleansed
    business_name: Team
    business_context: 'An NBA franchise: one row per team_id (30 teams). Name = city + team_nickname (e.g. Boston Celtics); team_abbreviation (BOS). Attributes (arena, arena_capacity, team_owner, general_manager, head_coach, dleague_affiliation, min_year, max_year, year_founded) are a single snapshot as of 2019, not season history. team_id stays with a franchise through relocations and renames (New Jersey to Brooklyn, Seattle to Oklahoma City, Charlotte Bobcats to Hornets).'
    grain: one row per franchise (team_id)
    keys:
      - team_id
    analytical_role: dimension
    owner: Kranthi
    status: certified
  - id: season
    dbt_model: model.nba_analysis.dim_seasons
    business_name: Season
    business_context: 'An NBA season: one row per season_id (2003-2022, 20 rows). season_id = season_name = the start year (2017 = 2017-18 season). start_date and end_date span every game of the season including preseason and playoffs. Season 2022 is partial (games through 2022-12-22). Shortened seasons: 2011 (lockout, 66 games per team), 2019 (suspended, bubble), 2020 (72 games per team).'
    grain: one row per season (season_id)
    keys:
      - season_id
    analytical_role: dimension
    owner: Kranthi
    status: certified
  - id: game
    dbt_model: model.nba_analysis.src_games
    business_name: Game
    business_context: 'One game with home and visitor team, final score and team box totals (pct, assists, rebounds). Not deduplicated: 29 season-2020 games appear twice (exact duplicates). Count games with COUNT(DISTINCT games_game_id), or use team_game WHERE is_home for game-level questions. 26,651 rows, 26,622 games, seasons 2003-2022, all game types (first digit of games_game_id: 1 preseason, 2 regular season, 4 playoffs, 5 play-in). home_team_wins = 1 when the home team won. pts_home and pts_away are NULL for 99 preseason 2003 games. There is no fg_pct_home column (the view drops it).'
    grain: one row per game (games_game_id); 29 games duplicated
    keys:
      - games_game_id
    analytical_role: event
    owner: Kranthi
    status: reviewed
  - id: team_standing
    dbt_model: model.nba_analysis.src_ranking
    business_name: Team standing
    business_context: 'Daily league standings: one row per team, season_id and standings_date, with conference (East/West), g, w, l, w_pct, home_record, road_record. season_id = game-type digit + start year: 22017 = 2017-18 regular season, 12017 = its preseason (regular seasons 2002-2022, preseasons 2003-2022). The final regular-season standings are the rows with the latest standings_date of a 2YYYY season_id. No team_id: team is a city label ("L.A. Lakers", "LA Clippers", "New Jersey", "Seattle"), so it does not join to team by key. 29 rows are exact duplicates of another row.'
    grain: one row per team per standings_date per season_id (season_id, standings_date, team); 29 duplicate rows
    keys:
      - season_id
      - standings_date
      - team
    analytical_role: snapshot
    owner: Kranthi
    status: reviewed
  - id: legacy_player_season_stats
    dbt_model: model.nba_analysis.int_season_stats
    business_name: Legacy player season stats (do not use)
    business_context: 'Not for analysis: seasons 2009-2019 only, players listed in raw_players only, and games_played counts DNP games. Use player_season (local_player_season_facts). 6,305 player-seasons; games_played is higher than the participated count for 5,352 of them (64,014 extra games), so per-game figures and efficiency_rating are understated. Percentages are averages of game percentages.'
    grain: one row per player per season (player_id, season), 2009-2019 only
    keys:
      - player_id
      - season
    analytical_role: snapshot
    owner: Kranthi
    status: deprecated
  - id: legacy_player_game_stats
    dbt_model: model.nba_analysis.int_player_stats
    business_name: Legacy player game stats (do not use)
    business_context: 'Not for analysis: seasons 2009-2019 only, no team_id, game id stored as text, and DNP rows turned into zero-stat rows. Use player_game (local_player_game_facts). 383,704 rows against 383,958 player-game rows for the same seasons in player_game.'
    grain: one row per game per player (details_game_id, player_id), 2009-2019 only
    keys:
      - details_game_id
      - player_id
    analytical_role: event
    owner: Kranthi
    status: deprecated
  - id: legacy_player_journey
    dbt_model: model.nba_analysis.fct_player_journey
    business_name: Legacy player journey (do not use)
    business_context: 'Not for analysis: built on int_season_stats, so it covers 2009-2019 only and counts DNP games as played; career totals and career_season_number start in 2009. Use player_season. Bio and team columns come from a 2016-only sample matched by name. For career or season-over-season figures, sum or compare player_season rows.'
    grain: one row per player per season (player_id, season), 2009-2019 only
    keys:
      - player_id
      - season
    analytical_role: snapshot
    owner: Kranthi
    status: deprecated
  - id: legacy_player_performance
    dbt_model: model.nba_analysis.fct_player_performance
    business_name: Legacy player performance (do not use)
    business_context: 'Not for analysis: seasons 2009-2019 only and per-game averages divide by games that include DNP games. Use player_season and compute ratios from its totals. True shooting = total_points / (2 * (total_field_goals_attempted + 0.44 * total_free_throws_attempted)); effective FG% = (total_field_goals_made + 0.5 * total_three_pointers_made) / total_field_goals_attempted.'
    grain: one row per player per season (player_id, season), 2009-2019 only
    keys:
      - player_id
      - season
    analytical_role: snapshot
    owner: Kranthi
    status: deprecated
  - id: legacy_player_roster
    dbt_model: model.nba_analysis.dim_players_cleansed
    business_name: Legacy player roster (do not use)
    business_context: 'Not for analysis: player-team-season list for seasons 2009-2019 only (7,228 stints). Use SELECT DISTINCT player_id, team_id, season FROM local_player_game_facts for all 20 seasons. Every row here also appears in player_game; player_game holds 93 more stints for the same seasons.'
    grain: one row per player per team per season (player_id, team_id, season), 2009-2019 only
    keys:
      - player_id
      - team_id
      - season
    analytical_role: bridge
    owner: Kranthi
    status: deprecated
  - id: raw_player_box_scores
    dbt_model: model.nba_analysis.src_games_details
    business_name: Raw player box scores (do not use)
    business_context: 'Not for analysis: raw player box scores with 289 duplicate (game, team, player) keys, 26 of them with differing values, and no participation flag. Use player_game (local_player_game_facts). 668,628 rows for 668,339 keys; no season or game date.'
    grain: player box-score rows (details_game_id, details_team_id, player_id); 289 keys duplicated
    keys:
      - details_game_id
      - details_team_id
      - player_id
    analytical_role: event
    owner: Kranthi
    status: deprecated
  - id: player_bio_2016
    dbt_model: model.nba_analysis.stg_player_information
    business_name: Player bio sample 2016 (do not use)
    business_context: 'Not for analysis: 451 player bios (position, height_cm, weight, birth_date, age, school) for season 2016 only, keyed by player_name with no player_id. Matching to other tables by name is unreliable; there is no bio for other seasons.'
    grain: one row per player name per team for season 2016 (player_name, team_id, season)
    keys:
      - player_name
      - team_id
      - season
    analytical_role: dimension
    owner: Kranthi
    status: deprecated
concepts:
  - id: player
    name: Player
    description: 'An NBA player, identified by player_id in every table. The project has no one-row-per-player table: list players from player_season (local_player_season_facts) with MIN(player_name) per player_id.'
    synonyms:
      - athlete
    bindings:
      - entity: player_season
        role: canonical
        grain: player_id, season
      - entity: player_game
        role: conformed
        grain: game_id, team_id, player_id
    rule: player_id has the same meaning in player_game and player_season; a player's season row holds exactly the participated games of their player_game rows for that season (558,670 played games, 5,412,407 points on both sides).
    owner: Kranthi
    status: reviewed
rules:
  - id: participation_counts_only_played_games
    kind: custom
    expression: A player-game counts as played only when local_player_game_facts.participated = true (blank comment and at least one of points, field goals made, field goals attempted, assists, rebounds populated). The 109,669 rows with participated = false (DNP, DND, NWT) must not count toward games played, per-game averages or statistical counts.
  - id: one_canonical_row_per_key
    kind: custom
    expression: 'Sources repeat records: raw_games holds 29 duplicate game rows (season 2020) and raw_games_details 289 duplicate (game_id, team_id, player_id) keys, 26 with differing values. The local_* tables keep one canonical row per key (lexicographically smallest serialized source row); raw_*, src_games and src_games_details do not.'
  - id: season_is_start_year
    kind: custom
    expression: 'season is the year a season starts: 2017 means the 2017-18 season, played from autumn 2017 into 2018. Seasons 2003-2022 are present; 2022 is partial (through 2022-12-22). Standings season_id prefixes the type digit: 22017.'
  - id: game_type_from_game_id
    kind: custom
    expression: 'The first digit of game_id gives the game type: 1 preseason, 2 regular season, 4 playoffs, 5 play-in (2020 on). Every local_* table includes all game types; restrict with CAST(game_id AS VARCHAR) LIKE ''2%'' for regular season or LIKE ''4%'' for playoffs. local_player_season_facts and local_team_season_facts combine all types.'
  - id: team_game_needs_team_key
    kind: fanout
    expression: A game has two team_game rows. Join player_game to team_game on (game_id, team_id) for the player's own team, or team_game to itself on (game_id, opponent_team_id) = (game_id, team_id) for the opponent; never on game_id alone.
  - id: team_attributes_are_a_2019_snapshot
    kind: custom
    expression: dim_teams_cleansed has one current row per franchise (attributes as of 2019). It does not record a team's name, city, coach or arena in earlier seasons.
