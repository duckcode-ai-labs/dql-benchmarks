# Policies, their parties, coverage periods and policy amounts.
# Column names are the dbt model columns (mixed case, as materialized in schema main).
domain: insurance
area:
  id: policies
  name: Policies, parties and premiums
  description: >-
    A policy is an insurance agreement. Parties (people and organizations) play roles on a
    policy through agreement_party_role (PH = policy holder, AG = agent). A policy is split
    into policy coverage details (one per coverage period / insured object), and each coverage
    detail carries policy amounts; the premium table marks which policy amounts are premiums.
  references: [insurable_object]
entities:
  - id: policy
    dbt_model: model.cwd_benchmark_data.policy
    business_name: Policy
    business_context: >-
      One insurance policy (an agreement of type policy). Policy_Number is the business policy
      number; Effective_Date and Expiration_Date bound the whole policy term. Policy_Identifier
      is the same identifier as Agreement_Identifier in agreement_party_role and
      agreement_assessment. Status_Code and Geographic_Location_Identifier are empty in this data.
    analytical_role: dimension
    grain: Policy_Identifier
    keys: [Policy_Identifier]
    concept_refs: [policy]
    owner: insurance-analytics@acme-insurance.test
  - id: agreement
    dbt_model: model.cwd_benchmark_data.agreement
    business_name: Agreement
    business_context: >-
      The generic agreement record that a policy specializes. The dbt model has no column named
      Agreement_Identifier: the seed file's header labels its first column Agreement_Type_Code,
      but that column holds the agreement identifier, matching policy.Policy_Identifier
      (Agreement_Name is 'Policy ' followed by the policy number). Do not read
      Agreement_Type_Code as a type code. Product_Identifier and inception date are empty.
    analytical_role: dimension
    grain: Agreement_Type_Code
    keys: [Agreement_Type_Code]
    concept_refs: [policy]
    owner: insurance-analytics@acme-insurance.test
  - id: agreement_party_role
    dbt_model: model.cwd_benchmark_data.agreement_party_role
    business_name: Policy party role
    business_context: >-
      Bridge between agreements (policies) and parties: one row per agreement, party and role.
      Party_Role_Code PH marks the policy holder, AG the agent who sold the policy. The DDL key
      also includes Effective_Date, which is empty in this data, so role history is not available.
    analytical_role: bridge
    grain: Agreement_Identifier, Party_Identifier, Party_Role_Code
    keys: [Agreement_Identifier, Party_Identifier, Party_Role_Code]
    owner: insurance-analytics@acme-insurance.test
  - id: party
    dbt_model: model.cwd_benchmark_data.party
    business_name: Party
    business_context: >-
      Any person or organization the company deals with. Party has only its identifier in this
      data (name, type and dates are empty); names come from person (Person_Identifier =
      Party_Identifier) or organizations (Organization_Identifier = Party_Identifier).
    analytical_role: dimension
    grain: Party_Identifier
    keys: [Party_Identifier]
    concept_refs: [party, policy_holder, agent, underwriter]
    owner: insurance-analytics@acme-insurance.test
  - id: person
    dbt_model: model.cwd_benchmark_data.person
    business_name: Person
    business_context: >-
      A party who is a human being; Person_Identifier is the Party_Identifier. Only first,
      middle and last names are filled (only for persons who play a role); birth date, gender and
      other attributes are empty.
    analytical_role: dimension
    grain: Person_Identifier
    keys: [Person_Identifier]
    concept_refs: [party]
    owner: insurance-analytics@acme-insurance.test
  - id: organization
    dbt_model: model.cwd_benchmark_data.organizations
    business_name: Organization
    business_context: >-
      A party that is an organization; Organization_Identifier is the Party_Identifier. The only
      organization is the insurer itself.
    analytical_role: dimension
    grain: Organization_Identifier
    keys: [Organization_Identifier]
    concept_refs: [party]
    owner: insurance-analytics@acme-insurance.test
  - id: party_role
    dbt_model: model.cwd_benchmark_data.party_role
    business_name: Party role
    business_context: Code list of party roles. AG = Agent, UW = Underwriter, PH = PolicyHolder.
    analytical_role: dimension
    grain: Party_Role_Code
    keys: [Party_Role_Code]
    owner: insurance-analytics@acme-insurance.test
  - id: policy_coverage_detail
    dbt_model: model.cwd_benchmark_data.policy_coverage_detail
    business_name: Policy coverage detail
    business_context: >-
      One coverage period of a policy on one insurable object. Identified by Effective_Date plus
      Policy_Coverage_Detail_Identifier; Effective_Date and Expiration_Date bound the coverage
      period (yearly periods here), which is narrower than the policy term. Coverage, coverage
      part and description codes are empty.
    analytical_role: dimension
    grain: Effective_Date, Policy_Coverage_Detail_Identifier
    keys: [Effective_Date, Policy_Coverage_Detail_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: policy_amount
    dbt_model: model.cwd_benchmark_data.policy_amount
    business_name: Policy amount
    business_context: >-
      A money amount attached to a policy coverage detail (Policy_Amount, with the policy and
      coverage effective date). Generic parent of premium: a row is a premium only when its
      Policy_Amount_Identifier is in premium. Premium rows carry Amount_Type_Code 'Year'
      (annual amount); the other rows have an empty Amount_Type_Code and are not labeled in the
      data. Earning dates, location, insurable object and insurance type are empty. Governed
      metrics: written_premium, monthly_premium, other_policy_amount (see the metrics glossary).
    analytical_role: event
    grain: Policy_Amount_Identifier
    keys: [Policy_Amount_Identifier]
    concept_refs: [premium]
    owner: insurance-analytics@acme-insurance.test
  - id: premium
    dbt_model: model.cwd_benchmark_data.premium
    business_name: Premium
    business_context: >-
      Subtype marker of policy_amount: one row per policy amount that is a premium. It has no
      columns of its own; the premium amount, period and dates come from policy_amount through
      Policy_Amount_Identifier.
    analytical_role: event
    grain: Policy_Amount_Identifier
    keys: [Policy_Amount_Identifier]
    concept_refs: [premium]
    owner: insurance-analytics@acme-insurance.test
relationships:
  - id: policy_to_agreement
    from: policy
    to: agreement
    verb: is a
    description: >-
      A policy is an agreement. The agreement side of the key is the column the dbt model
      calls Agreement_Type_Code (it holds the agreement identifier).
    rationale: >-
      Proven in the data (both rows match, Agreement_Name = 'Policy ' || Policy_Number), but the
      agreement key column is mislabeled in the dbt model. Kept as draft until the dbt model
      exposes the column as Agreement_Identifier.
    keys: [{ from: Policy_Identifier, to: Agreement_Type_Code }]
    cardinality: one_to_one
    fanout: safe
    status: draft
    owner: insurance-analytics@acme-insurance.test
  - id: agreement_party_role_to_policy
    from: agreement_party_role
    to: policy
    verb: is a role on
    description: >-
      Each party role row belongs to one policy (Agreement_Identifier = Policy_Identifier). To
      find a policy's holder or agent, join policy to agreement_party_role and filter
      Party_Role_Code ('PH' holder, 'AG' agent); a policy has one row per role, so filter the
      role before aggregating policy measures.
    keys: [{ from: Agreement_Identifier, to: Policy_Identifier }]
    cardinality: many_to_one
    fanout: safe
    roles: { from: party role on policy, to: policy }
    status: certified
    owner: insurance-analytics@acme-insurance.test
    certifiedAgainst:
      from: { grain: "Agreement_Identifier, Party_Identifier, Party_Role_Code", keys: [Agreement_Identifier, Party_Identifier, Party_Role_Code] }
      to: { grain: Policy_Identifier, keys: [Policy_Identifier] }
    validation:
      status: passed
      checked_at: "2026-09-17T01:59:56.285Z"
      query_fingerprint: 44061757c71b59dac752dbc012153da36240139f7b0256c2d2af2eec0a7384f8
      proof_fingerprint: 0ab023caa08f60670119193bcd833d2ac81999c2960f8ca01d71f7f6f7d97d8f
