# Claims, the coverage they are made against, and claim money (reserves and payments).
domain: insurance
area:
  id: claims
  name: Claims, reserves and payments
  description: >-
    A claim is made against a policy coverage detail (through claim_coverage), is linked to a
    loss occurrence, an insured object and optionally a catastrophe. Claim money lives in
    claim_amount; loss_payment, loss_reserve, expense_payment and expense_reserve mark which
    claim amounts are of each kind.
  references: [policy_coverage_detail, insurable_object, policy]
entities:
  - id: claim
    dbt_model: model.cwd_benchmark_data.claim
    business_name: Claim
    business_context: >-
      One insurance claim. Company_Claim_Number is the business claim number. Claim_Open_Date
      and Claim_Close_Date are filled; reported, claims-made, reopen dates, status code and
      description are empty. Catastrophe_Identifier links the claim to a catastrophe type,
      Occurrence_Identifier to the loss event, Insurable_Object_Identifier to what was damaged.
      There is no policy column: reach the policy through claim_coverage. Governed metrics:
      claims, closed_claims, open_claims, avg_days_to_close; money metrics live on claim_amount.
    analytical_role: event
    grain: Claim_Identifier
    keys: [Claim_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: claim_amount
    dbt_model: model.cwd_benchmark_data.claim_amount
    business_name: Claim amount
    business_context: >-
      A money amount on a claim (Claim_Amount). Generic parent of loss payment, loss reserve,
      expense payment and expense reserve: what kind of amount a row is comes only from which of
      those four tables holds its Claim_Amount_Identifier. Amount_Type_Code, Event_Date, offer
      and insurance type are empty, so an amount has no date of its own.
    analytical_role: event
    grain: Claim_Amount_Identifier
    keys: [Claim_Amount_Identifier]
    concept_refs: [loss_payment, loss_reserve, expense_payment, expense_reserve]
    owner: insurance-analytics@acme-insurance.test
  - id: loss_payment
    dbt_model: model.cwd_benchmark_data.loss_payment
    business_name: Loss payment
    business_context: Subtype marker of claim_amount. A claim amount paid to settle the loss itself. The amount is claim_amount.Claim_Amount.
    analytical_role: event
    grain: Claim_Amount_Identifier
    keys: [Claim_Amount_Identifier]
    concept_refs: [loss_payment]
    owner: insurance-analytics@acme-insurance.test
  - id: loss_reserve
    dbt_model: model.cwd_benchmark_data.loss_reserve
    business_name: Loss reserve
    business_context: Subtype marker of claim_amount. An amount set aside for the expected loss on a claim. The amount is claim_amount.Claim_Amount.
    analytical_role: event
    grain: Claim_Amount_Identifier
    keys: [Claim_Amount_Identifier]
    concept_refs: [loss_reserve]
    owner: insurance-analytics@acme-insurance.test
  - id: expense_payment
    dbt_model: model.cwd_benchmark_data.expense_payment
    business_name: Expense payment
    business_context: Subtype marker of claim_amount. A claim amount paid for the cost of handling the claim (not the loss). The amount is claim_amount.Claim_Amount.
    analytical_role: event
    grain: Claim_Amount_Identifier
    keys: [Claim_Amount_Identifier]
    concept_refs: [expense_payment]
    owner: insurance-analytics@acme-insurance.test
  - id: expense_reserve
    dbt_model: model.cwd_benchmark_data.expense_reserve
    business_name: Expense reserve
    business_context: Subtype marker of claim_amount. An amount set aside for the expected cost of handling a claim. The amount is claim_amount.Claim_Amount.
    analytical_role: event
    grain: Claim_Amount_Identifier
    keys: [Claim_Amount_Identifier]
    concept_refs: [expense_reserve]
    owner: insurance-analytics@acme-insurance.test
  - id: claim_coverage
    dbt_model: model.cwd_benchmark_data.claim_coverage
    business_name: Claim coverage
    business_context: >-
      Bridge saying which policy coverage detail a claim is made against: one row per claim and
      coverage detail (Effective_Date + Policy_Coverage_Detail_Identifier). This is the path from
      a claim to its policy. Today every claim has exactly one row. Known conflict: for one claim
      the coverage detail named here insures a different object (and belongs to a different
      policy) than the object on claim.Insurable_Object_Identifier; the governed rule follows
      claim_coverage and answers must say so.
    analytical_role: bridge
    grain: Claim_Identifier, Effective_Date, Policy_Coverage_Detail_Identifier
    keys: [Claim_Identifier, Effective_Date, Policy_Coverage_Detail_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: catastrophe
    dbt_model: model.cwd_benchmark_data.catastrophe
    business_name: Catastrophe
    business_context: >-
      A catastrophe (a large, many-claim event). Only Catastrophe_Name is filled, and the names
      are peril types, not named events; type and industry
      codes are empty.
    analytical_role: dimension
    grain: Catastrophe_Identifier
    keys: [Catastrophe_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: occurrence
    dbt_model: model.cwd_benchmark_data.occurrences
    business_name: Loss occurrence
    business_context: >-
      The event that caused a loss, with its begin and end date (the date of loss). Name, times,
      location and catastrophic-event indicator are empty.
    analytical_role: event
    grain: Occurrence_Identifier
    keys: [Occurrence_Identifier]
    owner: insurance-analytics@acme-insurance.test
