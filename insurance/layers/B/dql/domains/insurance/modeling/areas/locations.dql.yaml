# Insured objects and where they are.
domain: insurance
area:
  id: locations
  name: Insured objects and locations
  description: >-
    An insurable object (the insured property) sits at a geographic location. A geographic
    location points to a postal address (location_address) and to a physical location with
    latitude and longitude (pysical_location).
  references: [policy, policy_amount, occurrence]
entities:
  - id: insurable_object
    dbt_model: model.cwd_benchmark_data.insurable_object
    business_name: Insurable object
    business_context: >-
      The thing that is insured (here, a property) and its geographic location. The object type
      code is empty, so the kind of object (house, vehicle) is not recorded.
    analytical_role: dimension
    grain: Insurable_Object_Identifier
    keys: [Insurable_Object_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: geographic_location
    dbt_model: model.cwd_benchmark_data.geographic_location
    business_name: Geographic location
    business_context: >-
      A location, with its State_Code, its postal address (Location_Address_Identifier) and its
      physical coordinates (Physical_Location_Identifier). Parent location, type, code, name and
      number are empty.
    analytical_role: dimension
    grain: Geographic_Location_Identifier
    keys: [Geographic_Location_Identifier]
    concept_refs: [location]
    owner: insurance-analytics@acme-insurance.test
  - id: location_address
    dbt_model: model.cwd_benchmark_data.location_address
    business_name: Address
    business_context: >-
      A postal address: Line_1_Address (street), Municipality_Name (city), State_Code,
      Postal_Code (zip code), Country_Code. Line 2 and validity dates are empty.
    analytical_role: dimension
    grain: Location_Address_Identifier
    keys: [Location_Address_Identifier]
    concept_refs: [location]
    owner: insurance-analytics@acme-insurance.test
  - id: physical_location
    dbt_model: model.cwd_benchmark_data.pysical_location
    business_name: Physical location
    business_context: >-
      The coordinates of a location (Latitude_Value, Longitude_Value). The dbt model name is
      spelled 'pysical_location'. Altitude, accuracy and name are empty.
    analytical_role: dimension
    grain: Physical_Location_Identifier
    keys: [Physical_Location_Identifier]
    concept_refs: [location]
    owner: insurance-analytics@acme-insurance.test
relationships:
  - id: insurable_object_to_geographic_location
    from: insurable_object
    to: geographic_location
    verb: is located at
    description: Each insurable object is at one geographic location.
    keys: [{ from: Geographic_Location_Identifier, to: Geographic_Location_Identifier }]
    cardinality: many_to_one
    fanout: safe
    status: certified
    owner: insurance-analytics@acme-insurance.test
    certifiedAgainst:
      from: { grain: Insurable_Object_Identifier, keys: [Insurable_Object_Identifier] }
      to: { grain: Geographic_Location_Identifier, keys: [Geographic_Location_Identifier] }
    validation:
