# Underwriting assessments of policies and the underwriters who performed them.
domain: insurance
area:
  id: underwriting
  name: Underwriting assessments
  description: >-
    An assessment is an evaluation with a begin and end date. agreement_assessment links an
    assessment to the policy it evaluated; assessment_result holds its outcome, and
    underwriting_assessment marks results that are underwriting assessments. Parties take part
    in an assessment through assesment_party_role (UW = underwriter).
  references: [policy, party, party_role]
entities:
  - id: assessment
    dbt_model: model.cwd_benchmark_data.assessment
    business_name: Assessment
    business_context: >-
      An evaluation (here, underwriting of a policy) with Begin_Date and End_Date. Description
      and reason are empty.
    analytical_role: event
    grain: Assessment_Identifier
    keys: [Assessment_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: assessment_result
    dbt_model: model.cwd_benchmark_data.assessment_result
    business_name: Assessment result
    business_context: The outcome of an assessment; Assessment_Result_Type_Code holds the result (value 'OK' in this data).
    analytical_role: event
    grain: Assessment_Result_Identifier
    keys: [Assessment_Result_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: underwriting_assessment
    dbt_model: model.cwd_benchmark_data.underwriting_assessment
    business_name: Underwriting assessment
    business_context: >-
      Subtype marker of assessment_result: an assessment result that is an underwriting
      assessment. Its dates, description and result code come from assessment_result and
      assessment.
    analytical_role: event
    grain: Assessment_Result_Identifier
    keys: [Assessment_Result_Identifier]
    concept_refs: [underwriting_assessment]
    owner: insurance-analytics@acme-insurance.test
  - id: agreement_assessment
    dbt_model: model.cwd_benchmark_data.agreement_assessment
    business_name: Policy assessment link
    business_context: Bridge between agreements (policies) and assessments; Agreement_Identifier is the Policy_Identifier.
    analytical_role: bridge
    grain: Agreement_Identifier, Assessment_Identifier
    keys: [Agreement_Identifier, Assessment_Identifier]
    owner: insurance-analytics@acme-insurance.test
  - id: assessment_party_role
    dbt_model: model.cwd_benchmark_data.assesment_party_role
    business_name: Assessment party role
    business_context: >-
      Bridge between assessments and parties: one row per party, assessment and role.
      Party_Role_Code UW marks the underwriter. (The dbt model name is spelled
      'assesment_party_role'.) Begin and end dates are empty.
    analytical_role: bridge
    grain: Party_Identifier, Assessment_Identifier, Party_Role_Code
    keys: [Party_Identifier, Assessment_Identifier, Party_Role_Code]
    owner: insurance-analytics@acme-insurance.test
relationships:
  - id: agreement_assessment_to_policy
    from: agreement_assessment
    to: policy
    verb: assesses
    description: Each policy assessment link names one policy (Agreement_Identifier = Policy_Identifier).
    keys: [{ from: Agreement_Identifier, to: Policy_Identifier }]
    cardinality: many_to_one
    fanout: safe
    status: certified
    owner: insurance-analytics@acme-insurance.test
    certifiedAgainst:
      from: { grain: "Agreement_Identifier, Assessment_Identifier", keys: [Agreement_Identifier, Assessment_Identifier] }
      to: { grain: Policy_Identifier, keys: [Policy_Identifier] }
    validation:
      status: passed
      checked_at: "2026-09-17T01:59:56.052Z"
      query_fingerprint: 90cb1f841636beb5a79dabb73db1fa72e18b515d0fb40c80ea7a0424d6e5d4fa
