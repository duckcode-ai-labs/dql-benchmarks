        "goldSql": "WITH prem AS (SELECT p.Policy_Number AS policy_number, SUM(pa.Policy_Amount) AS annual_premium FROM main.policy p JOIN main.policy_amount pa ON pa.Policy_Identifier=p.Policy_Identifier JOIN main.premium pr ON pr.Policy_Amount_Identifier=pa.Policy_Amount_Identifier WHERE pa.Effective_Date>=DATE '2019-01-01' AND pa.Effective_Date<DATE '2020-01-01' GROUP BY 1), losses AS (SELECT p.Policy_Number AS policy_number, SUM(ca.Claim_Amount) AS paid_loss FROM main.policy p JOIN main.policy_coverage_detail cd ON cd.Policy_Identifier=p.Policy_Identifier JOIN main.claim_coverage cc ON cc.Policy_Coverage_Detail_Identifier=cd.Policy_Coverage_Detail_Identifier JOIN main.claim c ON c.Claim_Identifier=cc.Claim_Identifier JOIN main.claim_amount ca ON ca.Claim_Identifier=c.Claim_Identifier JOIN main.loss_payment lp ON lp.Claim_Amount_Identifier=ca.Claim_Amount_Identifier WHERE c.Claim_Open_Date>=DATE '2019-01-01' AND c.Claim_Open_Date<DATE '2020-01-01' GROUP BY 1) SELECT prem.policy_number, losses.paid_loss*1.0/prem.annual_premium AS paid_loss_ratio FROM prem JOIN losses USING (policy_number) ORDER BY 1",
