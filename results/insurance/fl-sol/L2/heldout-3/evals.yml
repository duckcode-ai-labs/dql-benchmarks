      "expected": {
        "answerable": true,
        "goldRows": [
          [
            0.07456993182354199
          ]
        ],
        "goldSql": "WITH p AS ( SELECT pr.Effective_Date, pr.Policy_Amount FROM (SELECT pa.Policy_Amount_Identifier, pa.Policy_Identifier, pa.Effective_Date, pa.Policy_Coverage_Detail_Identifier, pa.Policy_Amount FROM main.policy_amount pa JOIN main.premium pr ON pr.Policy_Amount_Identifier = pa.Policy_Amount_Identifier) pr JOIN main.policy pol ON pol.Policy_Identifier = pr.Policy_Identifier WHERE pol.Policy_Number = 31003000336), ends AS ( SELECT arg_min(Policy_Amount, Effective_Date) AS first_premium, arg_max(Policy_Amount, Effective_Date) AS last_premium, date_diff('year', MIN(Effective_Date), MAX(Effective_Date)) AS years FROM p) SELECT power(last_premium * 1.0 / first_premium, 1.0 / years) - 1 AS cagr FROM ends",
        "goldAllowExtraColumns": true,
        "goldOrdered": false
      }
    },
