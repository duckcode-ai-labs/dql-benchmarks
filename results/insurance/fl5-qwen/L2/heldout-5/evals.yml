    {
      "name": "heldout-what-are-the-individual-loss-reserves-for-each-c-da6942",
      "question": "What are the individual loss reserves for each claim?",
      "expected": {
        "answerable": true,
        "goldRows": [
          [
            12312701,
            1000
          ],
          [
            12312702,
            2100
          ]
        ],
        "goldSql": "SELECT c.Company_Claim_Number AS claim_number, ca.Claim_Amount AS amount FROM main.claim c JOIN main.claim_amount ca ON ca.Claim_Identifier=c.Claim_Identifier JOIN main.loss_reserve t ON t.Claim_Amount_Identifier=ca.Claim_Amount_Identifier ORDER BY claim_number",
        "goldAllowExtraColumns": true,
        "goldOrdered": false
      }
    },
    {
      "name": "heldout-how-many-covered-claims-opened-in-each-month-of-2e1c52",
      "question": "How many covered claims opened in each month of 2019?",
      "expected": {
        "answerable": true,
        "goldRows": [
          [
            "2019-01-01T00:00:00",
            1
          ],
          [
            "2019-06-01T00:00:00",
            1
          ]
        ],
        "goldSql": "SELECT DATE_TRUNC('month',c.Claim_Open_Date) AS open_month, COUNT(*) AS claim_count FROM main.claim c JOIN main.claim_coverage cc ON cc.Claim_Identifier=c.Claim_Identifier JOIN main.policy_coverage_detail cd ON cd.Policy_Coverage_Detail_Identifier=cc.Policy_Coverage_Detail_Identifier JOIN main.policy p ON p.Policy_Identifier=cd.Policy_Identifier WHERE c.Claim_Open_Date>=DATE '2019-01-01' AND c.Claim_Open_Date<DATE '2020-01-01' GROUP BY 1 ORDER BY 1",
        "goldAllowExtraColumns": true,
        "goldOrdered": false
      }
    },
    {
      "name": "heldout-which-claim-has-the-larger-amount-of-reserved-lo-30a65e",
      "question": "Which claim has the larger amount of reserved losses, and how much is it?",
      "expected": {
        "answerable": true,
        "goldRows": [
          [
            12312702,
            2100
          ]
        ],
        "goldSql": "SELECT c.Company_Claim_Number AS claim_number, SUM(ca.Claim_Amount) AS total_amount FROM main.claim c JOIN main.claim_amount ca ON ca.Claim_Identifier=c.Claim_Identifier JOIN main.loss_reserve k ON k.Claim_Amount_Identifier=ca.Claim_Amount_Identifier GROUP BY 1 ORDER BY total_amount DESC,claim_number LIMIT 1",
        "goldAllowExtraColumns": true,
        "goldOrdered": false
      }
    },
    {
      "name": "heldout-what-is-the-increase-from-the-2018-to-the-2019-a-f487d5",
      "question": "What is the increase from the 2018 to the 2019 annual premium on policy 31003000336?",
      "expected": {
        "answerable": true,
        "goldRows": [
          [
            2000
          ]
        ],
        "goldSql": "SELECT MAX(CASE WHEN YEAR(pa.Effective_Date)=2019 THEN pa.Policy_Amount END)-MAX(CASE WHEN YEAR(pa.Effective_Date)=2018 THEN pa.Policy_Amount END) AS premium_increase FROM main.policy p JOIN main.policy_amount pa ON pa.Policy_Identifier=p.Policy_Identifier JOIN main.premium pr ON pr.Policy_Amount_Identifier=pa.Policy_Amount_Identifier WHERE p.Policy_Number=31003000336",
        "goldAllowExtraColumns": true,
        "goldOrdered": false
      }
    }
